<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  haiiro's font stacks. A glyph the first face lacks comes from the next one, not from
  whatever the system would pick:

    mono:    IBM VGA 8x16, Unifont, Unifont Upper
    display: Jacquard 24, IBM VGA 8x16, Unifont

  Unifont is drawn on the same 8x16 grid as the VGA face, so a fallback glyph keeps the cell.
  The mono rule comes first on purpose: after the display rule it would also extend the
  display stack.
-->
<fontconfig>
  <alias binding="same">
    <family>IBM VGA 8x16</family>
    <accept>
      <family>Unifont</family>
      <family>Unifont Upper</family>
    </accept>
  </alias>
  <alias binding="same">
    <family>Jacquard 24</family>
    <accept>
      <family>IBM VGA 8x16</family>
      <family>Unifont</family>
    </accept>
  </alias>
</fontconfig>

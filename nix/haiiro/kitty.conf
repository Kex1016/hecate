# haiiro for kitty: Rosé Pine (main), the IBM VGA 8x16 face at 16px, square and still.
# Installed by hecate's Home Manager module; included from kitty.conf, so anything set after
# the include wins.

font_family      IBM VGA 8x16
# The VGA face's bold is its double-width 2x cut, which breaks the cell grid.
bold_font        family="IBM VGA 8x16" style=Regular
italic_font      family="IBM VGA 8x16" style=Regular
bold_italic_font family="IBM VGA 8x16" style=Regular
font_size        12.0
disable_ligatures always

cursor_shape          block
cursor_blink_interval 0
cursor_trail          0
window_padding_width  8
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0

foreground            #e0def4
background            #191724
selection_foreground  #e0def4
selection_background  #403d52
cursor                #524f67
cursor_text_color     #e0def4
url_color             #c4a7e7

active_border_color   #31748f
inactive_border_color #403d52
bell_border_color     #f6c177

tab_bar_style            separator
tab_separator            " "
tab_bar_background       #191724
active_tab_foreground    #e0def4
active_tab_background    #26233a
inactive_tab_foreground  #6e6a86
inactive_tab_background  #191724
active_tab_font_style    normal
inactive_tab_font_style  normal

color0  #26233a
color8  #6e6a86
color1  #eb6f92
color9  #eb6f92
color2  #31748f
color10 #31748f
color3  #f6c177
color11 #f6c177
color4  #9ccfd8
color12 #9ccfd8
color5  #c4a7e7
color13 #c4a7e7
color6  #ebbcba
color14 #ebbcba
color7  #e0def4
color15 #e0def4

# haiiro for foot: Rosé Pine (main), the IBM VGA 8x16 face at 16px. Installed by hecate's Home
# Manager module and included from foot.ini, so anything set after the include wins.

[main]
font=IBM VGA 8x16:size=12
# The VGA face's bold is its double-width 2x cut, which breaks the cell grid.
font-bold=IBM VGA 8x16:size=12:style=Regular
font-italic=IBM VGA 8x16:size=12:style=Regular
font-bold-italic=IBM VGA 8x16:size=12:style=Regular
bold-text-in-bright=no
pad=8x8

[cursor]
style=block
blink=no

# Current foot dropped [colors] and [cursor].color for [colors-dark] and its cursor key.
[colors-dark]
cursor=e0def4 524f67
foreground=e0def4
background=191724
selection-foreground=e0def4
selection-background=403d52
urls=c4a7e7

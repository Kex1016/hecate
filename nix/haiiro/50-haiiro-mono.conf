<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  haiiro's mono stack for programs that only ask for "monospace": IBM VGA 8x16, then Unifont
  and Unifont Upper on the same 8x16 grid. It sits in the user's conf.d, which fontconfig reads
  before the system's default-font rules, so it comes first.
-->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>IBM VGA 8x16</family>
      <family>Unifont</family>
      <family>Unifont Upper</family>
    </prefer>
  </alias>
</fontconfig>

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The checks pull Qt (the shell) and two NixOS VMs; the runner's preinstalled SDKs leave
      # too little disk for that.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /
      - name: Enable KVM (for the NixOS VM test)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
            # Collect garbage mid-build when the disk runs low.
            min-free = 2147483648
            max-free = 8589934592
      - name: Build, clippy, fmt, tests and VM test
        run: nix flake check -L
